name: Activity map PR

on:
  push:
    branches:
      - automation/activity-map

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head automation/activity-map \
            --state open \
            --json url \
            --jq '.[0].url')

          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/activity-map \
              --title "Update activity map data" \
              --body "Automated privacy-filtered activity map refresh from the local Strava database.")
          fi

          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --auto --squash
